name: 每日签到

on:
  schedule:
    # GitHub cron 使用 UTC，北京时间 = UTC + 8
    - cron: "30 1 * * *"   # 北京时间每天 09:30
    - cron: "0 13 * * *"   # 北京时间每天 21:00
  workflow_dispatch:        # 支持手动触发，方便首次验证

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 诊断 WPS 域名连通性
        run: |
          echo "runner 出口 IP："
          curl -sS --max-time 10 https://ipinfo.io/json | grep -E '"ip"|"country"|"region"' || echo "(ipinfo 不可达)"
          echo "--- WPS 活动页可达性 ---"
          curl -sS -o /dev/null -w "personal-act.wps.cn -> HTTP %{http_code}, 耗时 %{time_total}s\n" --max-time 20 "https://personal-act.wps.cn/rubik2/portal/HD2025031821201822/YM2025031821202008" || echo "personal-act.wps.cn 连接失败/超时"
          curl -sS -o /dev/null -w "lingxi.kdocs.cn -> HTTP %{http_code}, 耗时 %{time_total}s\n" --max-time 20 "https://lingxi.kdocs.cn" || echo "lingxi.kdocs.cn 连接失败/超时"

      - name: 执行签到
        env:
          LINGXI_COOKIES_GZ_B64: ${{ secrets.LINGXI_COOKIES_GZ_B64 }}
          SERVERCHAN_TOKEN: ${{ secrets.SERVERCHAN_TOKEN }}
        run: python daily_checkin.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_id }}
          path: |
            *_log.txt
            *_status.json
          retention-days: 14

      - name: 失败时推送微信
        if: failure()
        env:
          SERVERCHAN_TOKEN: ${{ secrets.SERVERCHAN_TOKEN }}
        run: |
          python lingxi_notify.py "⚠️ GitHub Actions 签到失败
          仓库：${{ github.repository }}
          运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          常见原因：Cookie 过期需重新扫码，或站点改版。"
