name: 每日签到

on:
  schedule:
    # GitHub cron 使用 UTC，北京时间 = UTC + 8
    # 尽量避开整点：GitHub 官方提示整点调度负载高、更容易延迟
    - cron: "30 1 * * *"   # 北京时间每天 09:30
    - cron: "23 13 * * *"  # 北京时间每天 21:23
  workflow_dispatch:        # 支持手动触发，方便首次验证

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 执行签到
        env:
          LINGXI_COOKIES_GZ_B64: ${{ secrets.LINGXI_COOKIES_GZ_B64 }}
          SERVERCHAN_TOKEN: ${{ secrets.SERVERCHAN_TOKEN }}
        run: python daily_checkin.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_id }}
          path: |
            *_log.txt
            *_status.json
            *.png
          retention-days: 14

      - name: 失败时推送微信
        if: failure()
        env:
          SERVERCHAN_TOKEN: ${{ secrets.SERVERCHAN_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess, sys

          try:
              data = json.load(open("daily_checkin_status.json", encoding="utf-8"))
              detail = "\n".join(
                  f"{r['task']}: {r['status']} | {r['detail']}" for r in data.get("results", [])
              ) or "(无明细)"
          except Exception as exc:
              detail = f"(状态文件读取失败: {exc})"

          msg = (
              "⚠️ 签到任务失败\n"
              "仓库：${{ github.repository }}\n"
              "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
              "——— 各任务明细 ———\n" + detail
          )
          subprocess.run([sys.executable, "lingxi_notify.py", msg], check=False)
          PY
